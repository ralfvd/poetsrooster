services:
  poetsrooster:
    build:
      context: .
      args:
        APP_REVISION: ${APP_REVISION:-container}
    ports:
      - "8080:3000"
    environment:
      SCHOOL_ADMIN_PASSWORD: ${SCHOOL_ADMIN_PASSWORD:-}
      ACCESS_PASSWORD: ${ACCESS_PASSWORD:-}
      FEEDBACK_WHATSAPP_NUMBER: ${FEEDBACK_WHATSAPP_NUMBER:-}
    volumes:
      - poetsrooster-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1) })"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  poetsrooster-data:
